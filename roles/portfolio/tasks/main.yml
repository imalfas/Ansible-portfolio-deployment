---
# tasks file for portfolio

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Nginx web server
  apt:
    name: "{{ nginx_package_name }}"
    state: present

- name: Ensure Nginx service is started and enabled
  service:
    name: "{{ nginx_package_name }}"
    state: started
    enabled: yes

- name: Copy portfolio website files
  copy:
    src: "{{ item }}"
    dest: "{{ web_destination_path }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - index.html
    - about.html
    - projects.html
    - contact.html
    - style.css
  notify: Restart Nginx
